<!DOCTYPE html>
<html><head><title>Codex 70% Drop</title><script src='https://cdn.plot.ly/plotly-latest.min.js'></script></head>
<body style='background:#121212;color:#fff;padding:20px'>
<h1>James Jackson Codex – 70% Drop Live</h1>
<div id='chart'></div>
<script>
const data = [{x:1,y:0.8},{x:2,y:0.6},{x:3,y:0.4},{x:4,y:0.2},{x:5,y:0}];
Plotly.newPlot('chart', [{x:data.map(d=>d.x),y:data.map(d=>d.y),type:'scatter',mode:'lines+markers',name:'Errors'}], {title:'70% Drop – Shadow to Horizon'});
</script>
</body></html>
