<!DOCTYPE html>
<html><head><title>LumenShell</title><style>body { background:#121212; color:#44ff44; font-family: 'Courier New'; padding:20px; } #prompt { color:#ff7f0e; } #output { color:#fff; } #curve { height:400px; }</style></head>
<body><h1>LumenShell – Codex Voice</h1><div id='prompt'>codex></div><div id='output'></div><div id='curve'></div><script>const prompt = document.getElementById('prompt');prompt.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const cmd = e.target.value; document.getElementById('output').innerHTML += '<p>' + cmd + '</p>'; e.target.value = ''; } });</script></body></html>
